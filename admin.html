<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Edit Klasemen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>body{background:#f7f5fb;}</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><i class="bi bi-shield-lock-fill me-2"></i>Edit Klasemen</a>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Kembali ke Beranda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="alert alert-warning"><strong>Catatan:</strong> Halaman ini hanya UI. Penyimpanan ke database akan disambungkan kemudian.</div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header fw-bold">Tim</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6"><input class="form-control" placeholder="Nama tim"></div>
              <div class="col-md-6"><input class="form-control" placeholder="Kota asal"></div>
              <div class="col-md-6"><input class="form-control" placeholder="Pelatih"></div>
              <div class="col-md-6"><input class="form-control" placeholder="Stadion"></div>
            </div>
            <div class="mt-3 text-end"><button class="btn btn-primary btn-sm">Tambah / Simpan</button></div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header fw-bold">Pertandingan</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6"><input type="date" class="form-control"></div>
              <div class="col-md-3"><input class="form-control" placeholder="ID Home"></div>
              <div class="col-md-3"><input class="form-control" placeholder="ID Away"></div>
              <div class="col-md-3"><input class="form-control" placeholder="Skor Home"></div>
              <div class="col-md-3"><input class="form-control" placeholder="Skor Away"></div>
              <div class="col-md-6"><input class="form-control" placeholder="ID Pertandingan (opsional)"></div>
            </div>
            <div class="mt-3 text-end"><button class="btn btn-primary btn-sm">Tambah / Simpan</button></div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header fw-bold">Klasemen</div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead><tr>
                  <th>ID Tim</th><th>Main</th><th>Menang</th><th>Seri</th><th>Kalah</th>
                  <th>Gol Masuk</th><th>Gol Kemasukan</th><th>Selisih</th><th>Poin</th><th>Peringkat</th><th>Aksi</th>
                </tr></thead>
                <tbody id="tblKlasemen">
                  <tr>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><input class="form-control form-control-sm" value=""></td>
                    <td><button class="btn btn-outline-primary btn-sm">Simpan</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <button class="btn btn-outline-success btn-sm" onclick="addRow()"><i class="bi bi-plus-lg"></i> Baris baru</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function addRow(){
      const tr = document.querySelector('#tblKlasemen tr').cloneNode(true);
      tr.querySelectorAll('input').forEach(i=>i.value='');
      document.getElementById('tblKlasemen').appendChild(tr);
    }
  </script>
</body>
</html>
