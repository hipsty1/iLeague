<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#f7f5fb;}
    .card{border-radius:16px;border:1px solid #eee;box-shadow:0 10px 24px rgba(0,0,0,.04);}
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="fw-bold mb-0">Profil</h2>
          <a class="btn btn-outline-secondary btn-sm" href="index.html"><i class="bi bi-arrow-left"></i> Kembali</a>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input id="password" type="password" class="form-control">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                  <i id="eye" class="bi bi-eye"></i>
                </button>
              </div>
              <div class="form-text">Klik ikon mata untuk show/hide.</div>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-danger" href="signin.html" onclick="logout()">Logout</a>
              <button class="btn btn-primary" onclick="save()">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
    <div id="saveToast" class="toast text-bg-success border-0">
      <div class="d-flex">
        <div class="toast-body">Perubahan tersimpan.</div>
        <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePwd(){
      const input = document.getElementById('password');
      const eye = document.getElementById('eye');
      input.type = input.type==='password' ? 'text' : 'password';
      eye.classList.toggle('bi-eye-slash');
      eye.classList.toggle('bi-eye');
    }
    function save(){
      // Update localStorage (front-end demo)
      localStorage.setItem('authPassword', document.getElementById('password').value);
      (new bootstrap.Toast(document.getElementById('saveToast'))).show();
      // Optional: call PHP endpoint if available
      fetch('update_password.php', {
        method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({password: document.getElementById('password').value})
      }).catch(()=>{});
    }
    function logout(){
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('authEmail');
      localStorage.removeItem('authPassword');
      localStorage.removeItem('isAdmin');
    }
    // preload values
    document.addEventListener('DOMContentLoaded', function(){
      document.getElementById('email').value = localStorage.getItem('authEmail') || '';
      document.getElementById('password').value = localStorage.getItem('authPassword') || '';
    });
  </script>
</body>
</html>
